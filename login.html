<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindLawyer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/registerUser.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body class="d-flex justify-content-center align-items-center min-vh-100 position-relative" style="overflow-x: hidden">
    <main class="w-100">
      <div class="container" style="max-width: 450px">
        <form id="loginForm" class="row g-2" novalidate>
          <div class="header text-center">เข้าสู่ระบบ</div>

          <div class="form-input col-md-12 mt-4">
            <!-- <label for="email" class="form-label px-2 mb-1">อีเมล <span class="text-danger">*</span></label> -->
            <input type="email" class="form-control" id="email" required placeholder="อีเมล" />
            <div class="invalid-feedback">กรุณากรอกอีเมล</div>
          </div>

          <div class="form-input col-md-12 mt-3">
            <!-- <label for="password" class="form-label px-2 mb-1">รหัสผ่าน <span class="text-danger">*</span></label> -->
            <div class="position-relative">
              <input type="password" class="form-control" id="password" required placeholder="รหัสผ่าน" style="padding-right: 40px" />
              <i
                class="fa-solid fa-eye position-absolute text-secondary d-none"
                id="togglePassword"
                style="cursor: pointer; z-index: 10; right: 15px; top: 19px; transform: translateY(-50%)"
              ></i>
              <div class="invalid-feedback">กรุณากรอกรหัสผ่าน</div>
            </div>
          </div>

          <div class="col-12 d-flex justify-content-center align-items-center mt-4">
            <button type="submit" class="btn w-100">เข้าสู่ระบบ</button>
          </div>

          <div class="col-12 mt-4 text-center link">
            <p class="mb-2 text-muted" style="white-space: nowrap;">ยังไม่มีบัญชีผู้ใช้<a href="/user/registerUser.html">สมัครใช้งาน</a>หรือต้องการเป็นทนายความ<a href="/lawyer/registerLawyer.html">สมัครทนายความ</a></p>
          </div>
        </form>
      </div>
    </main>

    <script src="/js/auth.js"></script>

    
    <script>
      document.addEventListener("input", (e) => {
        if (e.target.tagName === "INPUT") {
          e.target.classList.remove("is-invalid");
        }
      });

      document.getElementById("password").addEventListener("input", function () {
        const toggleBtn = document.getElementById("togglePassword");
        if (this.value.length > 0) {
          toggleBtn.classList.remove("d-none");
        } else {
          toggleBtn.classList.add("d-none");
        }
      });

      document.getElementById("togglePassword").addEventListener("click", function () {
        const input = document.getElementById("password");
        if (input.type === "password") {
          input.type = "text";
          this.classList.replace("bi-eye", "bi-eye-slash");
        } else {
          input.type = "password";
          this.classList.replace("bi-eye-slash", "bi-eye");
        }
      });

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const form = document.getElementById("loginForm");
        let isValid = true;
        form.querySelectorAll("input").forEach((input) => {
          if (!input.checkValidity()) {
            input.classList.add("is-invalid");
            isValid = false;
          } else {
            input.classList.remove("is-invalid");
          }
        });
        if (!isValid) return;

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("http://localhost:3000/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            Auth.setSession(data.token, data.user);
            Swal.fire({
              icon: "success",
              title: "เข้าสู่ระบบสำเร็จ",
              showConfirmButton: false,
              timer: 1500,
            }).then(() => {
              if (data.user.role === "admin") window.location.href = "/admin/adminDashboard.html";
              else if (data.user.role === "lawyer") window.location.href = "/lawyer/lawyerDashboard.html";
              else window.location.href = "/search.html";
            });
          } else {
            Swal.fire({
              icon: "error",
              title: "เข้าสู่ระบบไม่สำเร็จ",
              text: data.error || "อีเมลหรือรหัสผ่านไม่ถูกต้อง",
            });
          }
        } catch (error) {
          Swal.fire({
            icon: "error",
            title: "เกิดข้อผิดพลาด",
            text: "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้",
          });
        }
      });
    </script>
  </body>
</html>
