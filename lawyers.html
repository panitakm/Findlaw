<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FindLawyer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/search.css" />
    <link rel="stylesheet" href="/css/lawyers.css" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body class="fade-in d-flex flex-column min-vh-100 lawyers-page">
    <nav class="header position-absolute w-100 mt-3 mt-md-4 px-2 px-md-4" style="z-index: 1030; border: none; background: transparent">
      <div
        class="container bg-white shadow-sm rounded-pill d-flex align-items-center justify-content-between px-3 px-md-4 py-2"
        style="background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(10px)"
      >
        <a class="navbar-brand fw-bold text-dark d-flex align-items-center gap-2" href="/search.html" style="text-decoration: none">
          <span style="font-weight: 800; font-size: 1.5rem; letter-spacing: -0.5px">FindLawyer</span>
        </a>

        <nav class="header-nav d-none d-lg-block position-absolute start-50 translate-middle-x">
          <ul class="nav nav-pills gap-1 align-items-center mb-0">
            <li class="nav-item">
              <a href="/search.html" class="nav-link fw-semibold text-muted px-3 py-2" style="border-radius: 20px; font-size: 0.95rem">หน้าแรก</a>
            </li>
            <li class="nav-item">
              <a
                href="/lawyers.html"
                class="nav-link fw-semibold text-dark px-3 py-2"
                style="border-radius: 20px; background: rgba(0, 0, 0, 0.05); font-size: 0.95rem"
                >ทนายความทั้งหมด</a
              >
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle fw-semibold text-muted px-3 py-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"
                style="border-radius: 20px; font-size: 0.95rem">
                สำหรับทนายความ
              </a>
              <ul class="dropdown-menu shadow-sm border-0 rounded-4 mt-2 p-2" style="background: rgba(255, 255, 255, 0.98)">
                <li><a class="dropdown-item py-2 px-3 fw-medium rounded-3" href="/lawyer/registerLawyer.html">สมัครทนายความ</a></li>
                <li><a class="dropdown-item py-2 px-3 fw-medium rounded-3" href="/login.html">เข้าสู่ระบบทนายความ</a></li>
              </ul>
            </li>
          </ul>
        </nav>

        <div class="d-flex align-items-center gap-2" id="navRightSection"></div>
      </div>
    </nav>

    <main class="d-flex flex-column slide-up delay-100">
      <div class="bg-decor-top"></div>
      <div class="bg-decor-circle"></div>

      <div class="container slide-up delay-200 main-content-container">
        <div class="row justify-content-center mb-5">
          <div class="col-lg-7">
            <form id="topSearchForm" class="search-pill-container shadow-sm d-flex align-items-center">
              <input type="text" id="topKeywordInput" class="search-pill-input flex-grow-1" placeholder="ค้นหา..." autocomplete="off" />
              <button type="submit" class="search-pill-button d-flex align-items-center justify-content-center">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </form>
          </div>
        </div>

        <div class="d-flex align-items-center flex-wrap mb-4 pb-3 border-bottom">
          <div class="me-3 fw-bold text-muted d-flex align-items-center">
            <i class="fa-solid fa-filter me-2 fs-5"></i>
          </div>
          <div id="activeFilters" class="d-flex flex-wrap gap-2 flex-grow-1 align-items-center"></div>
          <div class="ms-auto mt-2 mt-md-0">
            <a href="/lawyers.html" class="text-decoration-underline text-muted small fw-semibold">ล้างทั้งหมด</a>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-md-4 col-lg-3">
            <form id="sidebarFilterForm" class="bg-white p-4 border-0 rounded-4 shadow-sm">
              <div class="mb-4">
                <label class="filter-label fw-bold mb-2">ประเภทคดี</label>
                <div class="dropdown">
                  <button
                    class="form-select text-start text-muted d-flex justify-content-between align-items-center px-2 filter-input w-100"
                    type="button"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                  >
                    <span id="sidebarCategoryBtnText" class="text-truncate">เลือกประเภทคดี</span>
                  </button>
                  <ul class="dropdown-menu w-100 shadow-sm p-2 filter-dropdown-list" id="sidebarCategoryList"></ul>
                </div>
              </div>

              <div class="mb-4">
                <label class="filter-label fw-bold mb-2">จังหวัด</label>
                <div class="dropdown">
                  <button
                    class="form-select text-start text-muted d-flex justify-content-between align-items-center px-2 filter-input w-100"
                    type="button"
                    data-bs-toggle="dropdown"
                    data-bs-auto-close="outside"
                  >
                    <span id="sidebarProvinceBtnText" class="text-truncate">เลือกจังหวัด</span>
                  </button>
                  <ul class="dropdown-menu w-100 shadow-sm p-2 filter-dropdown-list" id="sidebarProvinceList"></ul>
                </div>
              </div>

              <div class="mb-4">
                <label class="filter-label fw-bold mb-2">ประสบการณ์ทำงาน</label>
                <select class="form-select text-muted filter-input" id="sidebarExperience">
                  <option value="">ทั้งหมด</option>
                  <option value="0-1">น้อยกว่า 1 ปี</option>
                  <option value="1-3">1-3 ปี</option>
                  <option value="4-6">4-6 ปี</option>
                  <option value="7-10">7-10 ปี</option>
                  <option value="11-50">10 ปีขึ้นไป</option>
                </select>
              </div>

              <div class="mb-4">
                <label class="filter-label fw-bold mb-2">ค่าบริการ (บาท)</label>
                <select class="form-select text-muted filter-input" id="sidebarPrice">
                  <option value="">ทั้งหมด</option>
                  <option value="0-1000">0 - 1,000</option>
                  <option value="1001-3000">1,000 - 3,000</option>
                  <option value="3001-5000">3,000 - 5,000</option>
                  <option value="5000+">5,000 ขึ้นไป</option>
                </select>
              </div>
            </form>
          </div>

          <!-- Right Content Grid -->
          <div class="col-md-8 col-lg-9">
            <div id="searchResults" class="row g-4 mb-5">
              <!-- Cards will be injected by JS -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Blue Footer Strip -->
    <footer class="mt-auto footer-custom"></footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/lawyers.js"></script>
  </body>
</html>
