<!doctype html>
<html lang="th" data-bs-theme="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ทนายความที่บันทึกไว้ - LegalPortal</title>
    <link

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/userProfile.css" />
    <link rel="stylesheet" href="/css/favorites.css" />
    <link rel="stylesheet" href="/css/userTheme.css" />
    <script src="/js/userTheme.js"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <div class="container-fluid p-0">
      <div class="row g-0 min-vh-100">
        <!-- Curved Navigation Sidebar (Exact design from sample image) -->
        <aside class="col-md-3 col-lg-2 p-0 d-md-block sidebar-curved position-sticky top-0" style="height: 100vh; overflow-y: auto">
          <div class="d-flex flex-column h-100">
            <!-- Logo & System Title -->
            <a href="/search.html" class="logo-brand">
              <i class="fa-solid fa-scale-balanced fs-3"></i>
              <span>FindLaw</span>
            </a>

            <!-- Menu Items -->
            <ul class="sidebar-nav-list mb-auto">
              <li>
                <a href="userProfile.html" class="nav-link">
                  <span class="nav-icon-badge"><i class="fa-solid fa-id-badge"></i></span>
                  <span>โปรไฟล์ของฉัน</span>
                </a>
              </li>
              <li>
                <a href="favorites.html" class="nav-link active">
                  <span class="nav-icon-badge"><i class="fa-solid fa-bookmark"></i></span>
                  <span>ทนายที่บันทึกไว้</span>
                </a>
              </li>
              <li>
                <a href="reviews.html" class="nav-link">
                  <span class="nav-icon-badge"><i class="fa-solid fa-star"></i></span>
                  <span>ประวัติการรีวิว</span>
                </a>
              </li>
            </ul>

            <hr class="my-4 border-secondary opacity-25 me-3" />

            <!-- Logout Button -->
            <ul class="sidebar-nav-list pb-4">
              <li>
                <a href="#" class="nav-link text-danger" id="logoutBtn" onclick="Auth.clearSession()">
                  <span class="nav-icon-badge text-danger"><i class="fa-solid fa-right-to-bracket"></i></span>
                  <span>ออกจากระบบ</span>
                </a>
              </li>
            </ul>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 p-0">
          <div class="user-header-bar d-flex justify-content-between align-items-center ps-4 pt-3 pb-3 pe-4">
            <form action="/lawyers.html" method="GET" class="mb-0 flex-grow-1">
              <div class="input-group bg-white rounded-3 shadow-sm border p-1">
                <button
                  class="btn border-0 dropdown-toggle text-muted fw-bold pe-3 shadow-none"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                  id="filterDropdownBtn"
                  data-bs-auto-close="outside"
                  style="border-right: 1px solid #e0e0e0 !important; border-radius: 0"
                >
                  ตัวกรอง
                </button>
                <div class="dropdown-menu p-3 shadow-sm" style="width: 280px; z-index: 1050; border: none; border-radius: 10px">
                  <div class="mb-3">
                    <label class="form-label small fw-bold">ประสบการณ์</label>
                    <select name="experience" class="form-select form-select-sm filter-select">
                      <option value="">ทั้งหมด</option>
                      <option value="0-1">น้อยกว่า 1 ปี</option>
                      <option value="1-3">1-3 ปี</option>
                      <option value="4-6">4-6 ปี</option>
                      <option value="7-10">7-10 ปี</option>
                      <option value="11-50">10 ปีขึ้นไป</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label class="form-label small fw-bold">อัตราค่าบริการ</label>
                    <select name="price" class="form-select form-select-sm filter-select">
                      <option value="">ทั้งหมด</option>
                      <option value="0-1000">0 - 1,000</option>
                      <option value="1001-3000">1,000 - 3,000</option>
                      <option value="3001-5000">3,000 - 5,000</option>
                      <option value="5000+">5,000 ขึ้นไป</option>
                    </select>
                  </div>
                </div>

                <input
                  type="text"
                  name="keyword"
                  class="form-control border-0 shadow-none bg-transparent ps-3"
                  placeholder="ค้นหาทนายความ กฎหมาย หรือคดี..."
                />

                <button class="btn border-0 text-muted px-3 shadow-none" type="submit" style="border-radius: 0">
                  <i class="fa-solid fa-magnifying-glass" style="font-size: 1.1rem; font-weight: bold; -webkit-text-stroke: 0.5px"></i>
                </button>
              </div>
            </form>

            <div class="d-flex align-items-center gap-3">
              <!-- User Profile Avatar Header -->
              <div class="d-flex align-items-center gap-3 border-start ps-3 ms-2">
                <div class="d-none d-md-block text-end">
                  <div class="fw-bold" style="font-size: 0.95rem" id="headerUsername"></div>
                  <div class="text-muted small">ผู้ใช้งานทั่วไป</div>
                </div>
                <img
                  src="/css/pic/person-circle.svg"
                  alt="Profile"
                  width="44"
                  height="44"
                  id="headerPic"
                  class="rounded-circle border border-2 border-primary"
                  style="object-fit: cover"
                />
              </div>
            </div>
          </div>

          <!-- Main Workspace -->
          <div class="p-4 p-md-5">
            <!-- Page Title & Stats -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
              <div>
                <h2 class="fw-bold mb-1"><i class="fa-solid fa-bookmark me-2 text-danger"></i>ทนายความที่บันทึกไว้</h2>
              </div>
            </div>

            <!-- Search & Filter Glass Card -->
            <!-- <div class="glass-card p-4 mb-4">
            <div class="row g-3 align-items-center">
              <div class="col-md-5">

                </div>
              </div>

                </select>

            <!-- Lawyers Grid Container -->
            <div class="row g-4" id="savedLawyersContainer">
              <!-- Rendered dynamically via favorites.js -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Contact Modal -->
    <div class="modal fade" id="contactModal" tabindex="-1" aria-labelledby="contactModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-content-theme border-0 shadow-lg p-2">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="contactModalLabel"><i class="fa-solid fa-phone-volume me-2 text-primary"></i>ช่องทางการติดต่อ</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body p-4">
            <h6 class="fw-bold mb-3 text-secondary" id="modalLawyerName">ทนายความ</h6>

            <div class="list-group list-group-flush border-0">
              <a
                id="modalLawyerPhoneLink"
                href="#"
                class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0 rounded-3 mb-2 glass-card"
              >
                <div
                  class="bg-success text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fa-solid fa-phone"></i>
                </div>
                <div>
                  <div class="text-muted small">เบอร์โทรศัพท์</div>
                  <div class="fw-bold" id="modalLawyerPhone">-</div>
                </div>
              </a>

              <a
                id="modalLawyerEmailLink"
                href="#"
                class="list-group-item list-group-item-action d-flex align-items-center py-3 border-0 rounded-3 mb-2 glass-card"
              >
                <div
                  class="bg-primary text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fa-solid fa-envelope"></i>
                </div>
                <div>
                  <div class="text-muted small">อีเมล</div>
                  <div class="fw-bold" id="modalLawyerEmail">-</div>
                </div>
              </a>

              <div class="list-group-item d-flex align-items-center py-3 border-0 rounded-3 mb-2 glass-card">
                <div
                  class="bg-info text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fa-brands fa-line"></i>
                </div>
                <div>
                  <div class="text-muted small">Line ID</div>
                  <div class="fw-bold" id="modalLawyerLine">-</div>
                </div>
              </div>

              <div class="list-group-item d-flex align-items-center py-3 border-0 rounded-3 glass-card">
                <div
                  class="bg-secondary text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
                  style="width: 40px; height: 40px"
                >
                  <i class="fa-solid fa-location-dot"></i>
                </div>
                <div>
                  <div class="text-muted small">ที่อยู่สำนักงาน</div>
                  <div class="fw-semibold small" id="modalLawyerAddress">-</div>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">ปิดหน้าต่าง</button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/auth.js"></script>
    <script src="/js/globalSearch.js"></script>
    <script src="/js/favorites.js"></script>
  </body>
</html>
