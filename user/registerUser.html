<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/registerUser.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
  <main class="w-100">
      <div class="container">
        <form class="row g-2 needs-validation" novalidate>
          <div class="header text-center">สมัครสมาชิก</div>
          <div class="col-12 d-flex justify-content-center align-items-center mb-3 mt-2 ">
            <div class="uploadProfile">
              <img src="/css/pic/person-circle.svg" id="previewProfile" class="profilePreview" alt="Profile">
              <label for="inputPic" class="uploadPic">
                <span>เพิ่มรูปประจำตัว</span>
              </label>
              <input type="file" id="inputPic" name="profilePic" accept="image/JPEG, image/PNG" style="display: none;">
            </div>
          </div>
          <div class="form-input col-md-6">
            <label for="inputFirsname" class="form-label px-2">ชื่อ <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputFirsname" placeholder=" " required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-6">
            <label for="inputLastname" class="form-label px-2">นามสกุล <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputLastname" placeholder=" " required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-12">
            <label for="inputEmail" class="form-label px-2">Email Address <span style="color: red;">*</span></label>
            <input type="email" class="form-control form-control-lg" id="inputEmail" placeholder="exmple@gmail.com" required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-6">
            <label for="inputPassword" class="form-label px-2">สร้างรหัสผ่าน <span style="color: red;">*</span></label>
            <input type="password" class="form-control form-control-lg" id="inputPassword" required 
            pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" title="รหัสผ่านต้องประกอบไปด้วย A-Z, a-z, 0-9 อย่างน้อย 8 ตัว"/>
            <div id="passwordFeedback" class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-6">
            <label for="confirmPassword" class="form-label px-2">ยืนยันรหัสผ่าน <span style="color: red;">*</span></label>
            <input type="password" class="form-control form-control-lg" id="confirmPassword" required/>
            <div id="confirmFeedback" class="invalid-feedback"></div>
          </div>
          <div class="link d-flex justify-content-end">มีบัญชีแล้ว?<a href="">เข้าสู่ระบบ</a></div>
          <div class="col-12 d-flex justify-content-center align-items-center mt-4">
                <button type="submit" class="btn btn-submit">สมัครสมาชิก</button>
          </div>
        </form>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/js/registerLawyer.js"></script>
  </main>
</body>
</html>
