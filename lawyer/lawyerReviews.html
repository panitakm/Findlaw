<!doctype html>
<html lang="th" data-bs-theme="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ตรวจสอบรีวิว - LegalPortal (Lawyer)</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- สไตล์เฉพาะสำหรับหน้ารีวิวเพิ่มเติม -->
    <link rel="stylesheet" href="/css/userProfile.css" />
    <link rel="stylesheet" href="/css/lawyerReviews.css" />
    <link rel="stylesheet" href="/css/userTheme.css" />
    <script src="/js/userTheme.js"></script>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  </head>
  <body>
    <div class="container-fluid p-0">
      <div class="row g-0 min-vh-100">
        <!-- Curved Navigation Sidebar -->
        <aside class="col-md-3 col-lg-2 p-0 d-md-block sidebar-curved position-sticky top-0" style="height: 100vh; overflow-y: auto">
          <div class="d-flex flex-column h-100">
            <!-- Logo & System Title -->
            <a href="#" class="logo-brand">
              <i class="fa-solid fa-scale-balanced fs-3"></i>
              <span>FindLaw</span>
            </a>

            <!-- Menu Items -->
            <ul class="sidebar-nav-list mb-auto">
              <li>
                <a href="lawyerDashboard.html" class="nav-link">
                  <span class="nav-icon-badge"><i class="fa-solid fa-grid-2"></i></span>
                  <span>ภาพรวมข้อมูล</span>
                </a>
              </li>
              <li>
                <a href="lawyerEdit.html" class="nav-link">
                  <span class="nav-icon-badge"><i class="fa-solid fa-id-card"></i></span>
                  <span>แก้ไขโปรไฟล์</span>
                </a>
              </li>
              <li>
                <a href="lawyerReviews.html" class="nav-link active">
                  <span class="nav-icon-badge"><i class="fa-solid fa-star"></i></span>
                  <span>ตรวจสอบรีวิว</span>
                </a>
              </li>
            </ul>

            <hr class="my-4 border-secondary opacity-25 me-3" />
            <!-- Logout Button -->
            <!-- Logout Button -->
            <ul class="sidebar-nav-list pb-4">
              <li>
                <a href="#" class="nav-link text-danger" id="logoutBtn" onclick="Auth.clearSession()">
                  <span class="nav-icon-badge text-danger"><i class="fa-solid fa-right-to-bracket"></i></span>
                  <span>ออกจากระบบ</span>
                </a>
              </li>
            </ul>
          </div>
        </aside>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 p-0 bg-light">
          <!-- Header Bar -->
          <div class="user-header-bar d-flex justify-content-end align-items-center ps-4 pt-3 pb-3 pe-4 mb-1">
            <div class="d-flex align-items-center gap-3">
              <!-- User Profile Avatar Header -->
              <div class="d-flex align-items-center gap-3 border-start ps-3 ms-2">
                <div class="d-none d-md-block text-end">
                  <div class="fw-bold" style="font-size: 0.95rem" id="headerUsername">ทนายสมศักดิ์</div>
                  <div class="text-muted small">ทนายความ</div>
                </div>
                <img
                  src="/css/pic/person-circle.svg"
                  alt="Profile"
                  id="headerPic"
                  width="44"
                  height="44"
                  class="rounded-circle shadow-sm"
                  style="object-fit: cover"
                />
              </div>
            </div>
          </div>

          <!-- Main Workspace -->
          <div class="p-4 p-md-5 pt-0">
            <div class="d-none d-md-block mb-5">
              <h3 class="fw-bold" style="color: var(--text-color)">ตรวจสอบรีวิวและตอบกลับ</h3>
            </div>

            <!-- ภาพรวมคะแนนรีวิว (Glass Card) -->
            <div class="glass-card p-4 p-md-5 mb-5">
              <div class="row align-items-center">
                <div class="col-md-4 text-center border-end-md mb-4 mb-md-0 border-opacity-25" style="border-color: var(--text-color) !important">
                  <div class="display-3 fw-bold text-primary mb-2" id="avgRatingDisplay">0.0</div>
                  <div class="text-warning fs-4 mb-2" id="avgStarsDisplay">
                    <i class="fa-regular fa-star text-muted"></i>
                    <i class="fa-regular fa-star text-muted"></i>
                    <i class="fa-regular fa-star text-muted"></i>
                    <i class="fa-regular fa-star text-muted"></i>
                    <i class="fa-regular fa-star text-muted"></i>
                  </div>
                  <p class="text-muted mb-0" id="totalReviewsDisplay">จาก 0 รีวิว</p>
                </div>
                <div class="col-md-8 px-md-5">
                  <div class="rating-bar-group">
                    <!-- 5 ดาว -->
                    <div class="d-flex align-items-center mb-2">
                      <span class="fw-bold me-3" style="min-width: 40px; color: var(--text-color)">5 ดาว</span>
                      <div class="progress flex-grow-1" style="height: 10px; background-color: var(--glass-bg)">
                        <div
                          class="progress-bar bg-warning rounded-pill"
                          id="bar5"
                          role="progressbar"
                          style="width: 0%"
                          aria-valuenow="0"
                          aria-valuemin="0"
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span class="ms-3 text-muted" id="count5" style="min-width: 30px">0</span>
                    </div>
                    <!-- 4 ดาว -->
                    <div class="d-flex align-items-center mb-2">
                      <span class="fw-bold me-3" style="min-width: 40px; color: var(--text-color)">4 ดาว</span>
                      <div class="progress flex-grow-1" style="height: 10px; background-color: var(--glass-bg)">
                        <div
                          class="progress-bar bg-warning rounded-pill"
                          id="bar4"
                          role="progressbar"
                          style="width: 0%"
                          aria-valuenow="0"
                          aria-valuemin="0"
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span class="ms-3 text-muted" id="count4" style="min-width: 30px">0</span>
                    </div>
                    <!-- 3 ดาว -->
                    <div class="d-flex align-items-center mb-2">
                      <span class="fw-bold me-3" style="min-width: 40px; color: var(--text-color)">3 ดาว</span>
                      <div class="progress flex-grow-1" style="height: 10px; background-color: var(--glass-bg)">
                        <div
                          class="progress-bar bg-warning rounded-pill"
                          id="bar3"
                          role="progressbar"
                          style="width: 0%"
                          aria-valuenow="0"
                          aria-valuemin="0"
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span class="ms-3 text-muted" id="count3" style="min-width: 30px">0</span>
                    </div>
                    <!-- 2 ดาว -->
                    <div class="d-flex align-items-center mb-2">
                      <span class="fw-bold me-3" style="min-width: 40px; color: var(--text-color)">2 ดาว</span>
                      <div class="progress flex-grow-1" style="height: 10px; background-color: var(--glass-bg)">
                        <div
                          class="progress-bar bg-warning rounded-pill"
                          id="bar2"
                          role="progressbar"
                          style="width: 0%"
                          aria-valuenow="0"
                          aria-valuemin="0"
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span class="ms-3 text-muted" id="count2" style="min-width: 30px">0</span>
                    </div>
                    <!-- 1 ดาว -->
                    <div class="d-flex align-items-center mb-2">
                      <span class="fw-bold me-3" style="min-width: 40px; color: var(--text-color)">1 ดาว</span>
                      <div class="progress flex-grow-1" style="height: 10px; background-color: var(--glass-bg)">
                        <div
                          class="progress-bar bg-warning rounded-pill"
                          id="bar1"
                          role="progressbar"
                          style="width: 0%"
                          aria-valuenow="0"
                          aria-valuemin="0"
                          aria-valuemax="100"
                        ></div>
                      </div>
                      <span class="ms-3 text-muted" id="count1" style="min-width: 30px">0</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- ตัวกรองรีวิว -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
              <div class="filter-pills d-flex gap-2 flex-wrap">
                <button class="btn btn-filter active" onclick="filterReviews('all')">ทั้งหมด</button>
                <button class="btn btn-filter" onclick="filterReviews('need-reply')">ยังไม่ได้ตอบกลับ</button>
                <button class="btn btn-filter" onclick="filterReviews('5')">5 ดาว</button>
                <button class="btn btn-filter" onclick="filterReviews('4')">4 ดาว</button>
                <button class="btn btn-filter" onclick="filterReviews('1-3')">1-3 ดาว</button>
              </div>
              <div class="sort-dropdown">
                <select class="form-select form-select-sm border-0 shadow-sm form-control-theme" style="border-radius: 20px; padding: 8px 16px">
                  <option value="newest">ใหม่ล่าสุด</option>
                  <option value="oldest">เก่าที่สุด</option>
                  <option value="highest">คะแนนสูงสุด</option>
                  <option value="lowest">คะแนนต่ำสุด</option>
                </select>
              </div>
            </div>

            <!-- รายการรีวิว -->
            <div id="reviewsContainer" class="d-flex flex-column gap-4">
              <!-- รีวิวจะถูกโหลดมาแสดงที่นี่ผ่าน JavaScript -->
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Modal สำหรับตอบกลับรีวิว -->
    <div class="modal fade" id="replyModal" tabindex="-1" aria-labelledby="replyModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card border-0" style="border-radius: 16px; background-color: var(--card-bg)">
          <div class="modal-header border-bottom-0 pb-0">
            <h5 class="modal-title fw-bold" id="replyModalLabel" style="color: var(--text-color)">
              <i class="fa-solid fa-comment-dots text-primary me-2"></i>ตอบกลับรีวิว
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" style="filter: var(--icon-filter)"></button>
          </div>
          <div class="modal-body pt-3">
            <div class="user-review-preview p-3 rounded mb-3" style="background-color: var(--glass-bg)">
              <div class="d-flex align-items-center mb-2">
                <strong id="modalUserName" class="me-auto" style="color: var(--text-color)">ชื่อผู้ใช้</strong>
                <div class="text-warning small" id="modalUserRating"></div>
              </div>
              <p id="modalUserComment" class="mb-0 text-muted fst-italic text-truncate"></p>
            </div>
            <form id="replyForm">
              <input type="hidden" id="reviewIdToReply" />
              <div class="mb-3">
                <label for="replyMessage" class="form-label fw-bold" style="color: var(--text-color)">ข้อความตอบกลับของคุณ</label>
                <textarea
                  class="form-control bg-white text-dark border p-3"
                  id="replyMessage"
                  rows="4"
                  placeholder="พิมพ์ข้อความตอบกลับที่นี่... ขอบคุณที่ใช้บริการ เป็นต้น"
                  required
                  style="border-radius: 12px"
                ></textarea>
                <div class="form-text mt-2 text-end"><span id="charCount">0</span>/500 ตัวอักษร</div>
              </div>
            </form>
          </div>
          <div class="modal-footer border-top-0 pt-0">
            <button type="button" class="btn btn-light rounded-pill px-4 text-dark" data-bs-dismiss="modal">ยกเลิก</button>
            <button type="button" class="btn btn-primary rounded-pill px-4" onclick="submitReply()">ส่งข้อความตอบกลับ</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal สำหรับรายงานความไม่เหมาะสม -->
    <div class="modal fade" id="reportModal" tabindex="-1" aria-labelledby="reportModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px)">
          <div class="modal-header border-bottom-0 pb-0 mt-2">
            <h5 class="modal-title fw-bold fs-5 text-danger" id="reportModalLabel"><i class="fa-solid fa-flag me-2"></i>รายงานความไม่เหมาะสม</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body pt-3 pb-4 px-4">
            <form id="reportForm">
              <input type="hidden" id="reportReviewId" value="" />
              <input type="hidden" id="reportTarget" value="" />

              <div class="mb-4">
                <label class="form-label fw-semibold text-dark">เหตุผลที่ต้องการรายงาน</label>
                <select class="form-select bg-light" id="reportReason" style="border-radius: 12px; border: 1px solid #dee2e6" required>
                  <option value="" selected disabled>-- เลือกเหตุผล --</option>
                  <option value="ใช้คำหยาบคายหรือไม่สุภาพ">ใช้คำหยาบคายหรือไม่สุภาพ</option>
                  <option value="เนื้อหาสแปมหรือโฆษณาแอบแฝง">เนื้อหาสแปมหรือโฆษณาแอบแฝง</option>
                  <option value="ข้อมูลเท็จหรือบิดเบือน">ข้อมูลเท็จหรือบิดเบือน</option>
                  <option value="ละเมิดความเป็นส่วนตัว">ละเมิดความเป็นส่วนตัว</option>
                  <option value="อื่นๆ">อื่นๆ</option>
                </select>
              </div>

              <div class="text-end mt-2">
                <button type="button" class="btn btn-light rounded-pill px-4 me-2 fw-semibold text-secondary" data-bs-dismiss="modal">ยกเลิก</button>
                <button type="submit" class="btn btn-danger px-4 rounded-pill fw-semibold shadow-sm">ส่งรายงาน</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/js/auth.js"></script>
    <script src="/js/lawyerReviews.js"></script>
  </body>
</html>
