<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/registerLawyer.css">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
  <main class="w-100">
      <div class="container">
        <form class="row g-2 needs-validation" novalidate>
          <div class="header text-center">ลงทะเบียนทนายความ</div>
          <div class="col-12 d-flex justify-content-center align-items-center mb-3 mt-2 ">
            <div class="uploadProfile">
              <img src="/css/pic/person-circle.svg" id="previewProfile" class="profilePreview" alt="Profile">
              <label for="inputPic" class="uploadPic">
                <span>เพิ่มรูปประจำตัว</span>
              </label>
              <input type="file" id="inputPic" name="profilePic" accept="image/JPEG, image/PNG" style="display: none;">
            </div>
          </div>
          <div class="form-input col-md-6">
            <label for="inputFirsname" class="form-label px-2">ชื่อ <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputFirsname" placeholder=" " required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-6">
            <label for="inputLastname" class="form-label px-2">นามสกุล <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputLastname" placeholder=" " required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-12">
            <label for="inputEmail" class="form-label px-2">Email Address <span style="color: red;">*</span></label>
            <input type="email" class="form-control form-control-lg" id="inputEmail" placeholder="exmple@gmail.com" required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-12">
            <label for="inputPhone" class="form-label px-2">เบอร์โทรศัพท์ <span style="color: red;">*</span></label>
            <div class=""></div>
            <input type="tel" class="form-control form-control-lg" id="inputPhone" maxlength="10" placeholder=" "  pattern="^0[0-9]{9}$" required/>
            <div class="invalid-feedback"></div>
          </div>

          <div class="form-input col-md-6">
            <label for="inputPassword" class="form-label px-2">สร้างรหัสผ่าน <span style="color: red;">*</span></label>
            <div class="position-relative">
              <input type="password" class="form-control form-control-lg pe-5" id="inputPassword" required 
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^a-zA-Z0-9]).{8,}" title="รหัสผ่านต้องประกอบไปด้วย A-Z, a-z, 0-9 อย่างน้อย 8 ตัว"/>
              <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-secondary" id="togglePassword" style="cursor: pointer; z-index: 10;"></i>
              <div id="passwordFeedback" class="invalid-feedback"></div>
            </div>
            <div class="progress mt-2" style="height: 6px; background-color: #e9ecef; border-radius: 4px;">
              <div id="passwordStrengthBar" class="progress-bar" role="progressbar" style="width: 0%; transition: width 0.3s ease;"></div>
            </div>
          </div>

          <div class="form-input col-md-6">
            <label for="confirmPassword" class="form-label px-2">ยืนยันรหัสผ่าน <span style="color: red;">*</span></label>
            <div class="position-relative">
              <input type="password" class="form-control form-control-lg pe-5" id="confirmPassword" required/>
              <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-secondary" id="toggleConfirmPassword" style="cursor: pointer; z-index: 10;"></i>
              <div id="confirmFeedback" class="invalid-feedback"></div>
            </div>
          </div>

          <div class="form-input col-md-6">
            <label for="inputLicNum" class="form-label px-2">เลขที่ใบอนุญาตทนายความ <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputLicNum" name="LicNum" required/>
            <div class="invalid-feedback"></div>
          </div>
          <div class="form-input col-md-6">
            <label class="form-label px-2">แนบเอกสารใบอนุญาตทนายความ <span style="color: red;">*</span></label>
            <input type="file" class="form-control form-control-lg" id="LicFile" required/>
            <div class="invalid-feedback">กรุณาแนบไฟล์!</div>
          </div>
          <div class="form-input col-md-12">
            <label for="inputAddress" class="form-label px-2">ที่อยู่ <span style="color: red;">*</span></label>
            <input type="text" class="form-control form-control-lg" id="inputAddress" name="officeAdd" placeholder=" " required/>
            <div class="invalid-feedback"></div>
          </div>
          <!-- <div class="form-input col-md-12">
            <label for="inputProvince" class="form-label px-2">จังหวัดที่ให้บริการ <span style="color: red;">*</span></label>
            <select class="form-select" id="inputProvince" name="ProvID" required>
            <div class="invalid-feedback"></div>
          </div> -->
          <div class="form-input col-md-12">
            <label for="inputProvince" class="form-label px-2">จังหวัดที่ให้บริการ <span style="color: red;">*</span></label>
            <select class="form-select" id="inputProvince" name="ProvID" required>
              <option selected disabled value="">- กำลังโหลดข้อมูลจังหวัด... -</option>
            </select>
            <div class="invalid-feedback">กรุณาเลือกจังหวัด</div>
          </div>
          <div class="link d-flex justify-content-end">มีบัญชีแล้ว?<a href="">เข้าสู่ระบบ</a></div>
          <div class="col-12 d-flex justify-content-center align-items-center mt-4">
            <button type="submit" class="btn btn-submit" id="submitBtn">
                <span class="spinner-border spinner-border-sm d-none" id="submitSpinner" role="status" aria-hidden="true"></span>
                <span id="submitText">สมัครสมาชิก</span>
            </button>
          </div>
        </form>
      </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="/js/registerLawyer.js"></script>

  </main>
</body>
</html>
